name: Update PSX-Place News Feed

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-update:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install required dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4 lxml Pillow requests

      - name: Probe PSX-Place access methods
        run: python .github/scripts/probe_psx_access.py

      - name: Run PSX-Place scraper
        shell: bash
        run: |
          echo "Working directory:"
          pwd

          echo "Repository files before scraping:"
          ls -la

          set +e
          python .github/scripts/scraper.py 2>&1 | tee scraper.log
          scraper_status=${PIPESTATUS[0]}
          set -e

          if [ "$scraper_status" -ne 0 ]; then
            if grep -qF "ERROR: No news articles were found. Nothing will be saved." scraper.log; then
              echo "No new articles found. Keeping the current feed unchanged."
              rm -f scraper.log
              exit 0
            fi

            echo "The scraper failed with exit code $scraper_status."
            rm -f scraper.log
            exit "$scraper_status"
          fi

          rm -f scraper.log

      - name: Check generated files
        run: |
          echo "Checking generated XML..."
          test -f files/whats_new.xml

          echo "XML material count:"
          material_count=$(grep -c "<mtrl" files/whats_new.xml || true)
          echo "$material_count"
          test "$material_count" -gt 0

          echo "Files folder:"
          ls -lah files || true

          echo "Generated image sample:"
          find resources/images -type f | head -50 || true

          echo "Git status after scraper:"
          git status --short

      - name: Commit and push changes
        run: |
          git config user.name "PS3-Pro Bot"
          git config user.email "bot@ps3pro.com"

          git add files/
          git add resources/images/uncompressed/
          git add resources/images/compressed/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-update: PSX-Place News Feed"
          git push
