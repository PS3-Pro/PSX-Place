name: Update PSX-Place News Feed

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-update:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install required dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4 lxml Pillow

      - name: Run PSX-Place scraper
        run: |
          echo "Working directory:"
          pwd

          echo "Repository files before scraping:"
          ls -la

          python .github/scripts/scraper.py

      - name: Check generated files
        run: |
          echo "Checking generated XML..."
          test -f files/whats_new.xml

          echo "XML material count:"
          grep -c "<mtrl" files/whats_new.xml

          echo "Files folder:"
          ls -lah files || true

          echo "Generated image sample:"
          find resources/images -type f | head -50 || true

          echo "Git status after scraper:"
          git status --short

      - name: Commit and push changes
        run: |
          git config user.name "PS3-Pro Bot"
          git config user.email "bot@ps3pro.com"

          git add files/
          git add resources/images/uncompressed/
          git add resources/images/compressed/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-update: PSX-Place News Feed"
          git push